name: checks

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plugin consistency (manifests, skills, links)
        run: python3 scripts/check-plugin.py
      - name: Playbooks
        run: python3 scripts/lint-playbooks.py
